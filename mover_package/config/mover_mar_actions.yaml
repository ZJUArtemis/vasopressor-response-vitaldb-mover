# MOVER MAR action classification for Topic 2 v3.
# Keep ONLY actions that denote actual drug execution (a real "new dose").
# Derived from the Topic 8 pre-flight mar_action_counts census.

keep_as_administration:
  - "Given"
  - "Bolus"
  - "Bolus From Bag"
  - "Given in incremental doses"
  - "New Bag"                 # infusion start
  - "Given by Other"
  - "Given By Pt"
  - "Restarted"
  - "ED Continuing Infusion"

keep_as_rate_change:          # infusion titration -> sensitivity set, not a START
  - "Rate Change"
  - "Rate Change Dual Sign"
  - "Restarted Dual Sign"

exclude:                      # orders / holds / verification / cancellations
  - "Due"
  - "Rate Verify"
  - "Rate Verify Dual Sign"
  - "Missed"
  - "MAR Hold"
  - "MAR Unhold"
  - "Manual MAR Hold"
  - "Automatically Held"
  - "Held"
  - "Canceled Entry"
  - "Stopped"
  - "IV Stop"
  - "Paused"
  - "Pending"
  - "See Alternative"
  - "See Anesthesia Documentation"
  - "Completed"
  - "Return to Cabinet"
  - "Patient Refused Vaccine"
  - "Patch Applied"
  - "Patch Removed"
  - "Controlled Patch Applied"
  - "Controlled Patch Removed"
  - "New Syringe/Cartridge"
