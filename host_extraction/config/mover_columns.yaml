# ---- optional columns (leave blank if the columns do not exist) ----
# Timestamp audit: the MAR entry and last-modification timestamps, if present in
# vasopressor_medications.csv. Run `bash run_v8.sh --inspect` first and copy the
# exact column names from the printed census. If they are absent, leave blank and
# the audit is skipped (this is reported, not silently ignored).
med_entry_time_col:
med_mod_time_col:

# ---- optional columns (leave blank if absent). Run --inspect to see names. ----
# Order-level fields that let an infusion's running rate be reconstructed and
# a "new bag" be distinguished from a genuine infusion start.
med_order_id_col:          # order / prescription identifier shared by rows of one infusion
med_order_start_col:       # order start timestamp
med_order_end_col:         # order end timestamp
# Intra-op fluid and blood-product tables, if present as separate files.
fluid_file:                # CSV with case_col, a timestamp, a volume; leave blank if none
fluid_time_col:
fluid_volume_col:
blood_file:
blood_time_col:
